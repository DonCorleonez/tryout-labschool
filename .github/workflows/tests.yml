name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pytest playwright && python -m playwright install --with-deps chromium
      - run: cd reference && QUIET_LOG=1 python -m pytest -q
      - run: node frontend/runner.test.js
